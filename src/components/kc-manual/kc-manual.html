<div class="kc-manual__mode">
    <button class="kc-manual__manual">Manual</button>
    <button class="kc-manual__profile">Profile</button>
</div>
<div class="kc-manual__profile-pane">
    <p>Profile:</p>
    <select class="kc-manual__profile-select">
        <option selected>1 - Cone 06</option>
    </select>
</div>
<div class="kc-manual__manual-pane">
    <p>Temp:</p>
    <input type="text" value="0" class="kc-manual__temp-override" />
</div>

<div class="kc-manual__controls">
    <button><span class="material-symbols-outlined">play_arrow</span></button>
    <button><span class="material-symbols-outlined">pause</span></button>
    <button><span class="material-symbols-outlined">stop</span></button>
</div>
